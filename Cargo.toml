[package]
name = "katana-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
egui = "0.31"
midir = "0.10"
roxmltree = "0.20"
parking_lot = "0.12"
anyhow = "1"
log = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
env_logger = "0.11"
regex-lite = "0.1.9"
[profile.release]
lto = true
strip = true

[lib]
name = "katana_rs_proto"
path = "src/lib.rs"
